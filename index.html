<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>HowScad — виртуальные номера Telegram</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* твой полный CSS, как выше, но я сокращу для краткости, добавлю только стили для зоны загрузки */
        .file-upload-area {
            background: rgba(255,255,255,0.03);
            border: 1px dashed rgba(38,165,228,0.5);
            border-radius: 60px;
            padding: 20px;
            margin: 16px 0;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .file-upload-area:hover {
            background: rgba(38,165,228,0.1);
            border-color: #26A5E4;
        }
        .file-upload-area i {
            font-size: 2rem;
            color: #26A5E4;
            margin-bottom: 8px;
        }
        .file-upload-area p {
            font-size: 0.8rem;
            color: #9ca3af;
        }
        #fileName {
            font-size: 0.75rem;
            color: #26A5E4;
            margin-top: 8px;
        }
        .preview-img {
            max-width: 100%;
            max-height: 150px;
            border-radius: 16px;
            margin-top: 10px;
            display: none;
        }
        .btn-success {
            background: linear-gradient(90deg, #10b981, #059669);
            color: white;
        }
    </style>
</head>
<body>
<!-- весь твой верхний блок hero, tabs, productsGrid и т.д. -->
<div class="container">
    <!-- ... -->
</div>

<!-- Модальное окно с формой загрузки чека -->
<div id="orderModal" class="modal">
    <div class="modal-card">
        <div class="modal-header">
            <div class="modal-icon">🛒</div>
            <h3>Оформление заказа</h3>
            <div class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></div>
        </div>
        <div id="modalOrderContent" class="order-summary"></div>
        <div class="payment-card" onclick="copyPhone()">
            <div class="payment-icon"><i class="fas fa-credit-card"></i></div>
            <div class="payment-info">
                <div class="payment-row"><span class="payment-label">📱 СБП</span><span class="payment-value">+7 902 736 57 59</span></div>
                <div class="payment-row"><span class="payment-label">👤 Получатель</span><span class="payment-value">Егор</span></div>
                <div class="payment-hint"><i class="fas fa-copy"></i> Нажмите, чтобы скопировать</div>
            </div>
        </div>
        <div class="telegram-field">
            <div class="field-icon"><i class="fab fa-telegram"></i></div>
            <input type="text" id="tgUser" class="tg-input" placeholder="например: myname7" autocomplete="off">
        </div>
        <div class="username-hint">
            <i class="fas fa-info-circle"></i> Только латиница, цифры, _ , длина от 5 до 7 символов. Без @
        </div>
        
        <!-- Зона для скриншота -->
        <div class="file-upload-area" id="fileUploadArea">
            <i class="fas fa-cloud-upload-alt"></i>
            <p>Нажмите или перетащите скриншот чека</p>
            <input type="file" id="screenshotFile" accept="image/*" style="display: none;">
            <div id="fileName"></div>
            <img id="previewImg" class="preview-img" alt="Preview">
        </div>
        
        <div class="action-buttons">
            <button class="btn-secondary" onclick="closeModal()"><i class="fas fa-arrow-left"></i> Назад</button>
            <button class="btn-primary btn-success" id="sendCheckBtn"><i class="fas fa-paper-plane"></i> Отправить чек</button>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast"></div>

<script>
    const countries = [
        { name: "🇺🇸 США (USA)", price: 80 },
        { name: "🇨🇦 Канада (Canada)", price: 65 },
        { name: "🇷🇺 Россия (новорег)", price: 140 },
        { name: "🇬🇧 Великобритания", price: 120 },
        { name: "🇩🇪 Германия", price: 110 },
        { name: "🇧🇩 Бангладеш", price: 90 },
        { name: "🇵🇭 Филиппины", price: 65 },
        { name: "🇳🇬 Нигерия", price: 60 },
        { name: "🇮🇳 Индия", price: 50 }
    ];
    let currentOrder = null;
    let selectedFile = null;

    function isValidTelegramUsername(username) {
        if (!username) return false;
        let clean = username.trim();
        if (clean.startsWith('@')) clean = clean.substring(1);
        if (clean.length < 5 || clean.length > 7) return false;
        return /^[a-zA-Z0-9_]+$/.test(clean);
    }

    function getRawTelegram() {
        let val = document.getElementById('tgUser').value.trim();
        if (!val) return null;
        let clean = val.startsWith('@') ? val.substring(1) : val;
        if (!isValidTelegramUsername(clean)) return null;
        return clean;
    }

    function getFormattedTelegram() {
        let raw = getRawTelegram();
        return raw ? '@' + raw : null;
    }

    function updateInputValidation() {
        const input = document.getElementById('tgUser');
        let val = input.value.trim();
        let clean = val.startsWith('@') ? val.substring(1) : val;
        if (val !== '' && !isValidTelegramUsername(clean)) {
            input.classList.add('error-field');
        } else {
            input.classList.remove('error-field');
        }
    }

    function renderProducts() {
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = countries.map(c => `
            <div class="product-card" onclick="openOrder('${c.name.replace(/'/g, "\\'")}', ${c.price})">
                <div class="product-info">
                    <div><span class="product-icon">📱</span><span class="product-name">${c.name}</span></div>
                    <div class="product-price">${c.price}<small> ₽</small></div>
                </div>
                <button class="btn-buy">Купить</button>
            </div>
        `).join('');
    }

    function openOrder(name, price) {
        currentOrder = { name, price };
        document.getElementById('modalOrderContent').innerHTML = `
            <p><i class="fas fa-box"></i> <strong>${name}</strong></p>
            <p><i class="fas fa-tag"></i> Сумма: <strong>${price} ₽</strong></p>
        `;
        const tgField = document.getElementById('tgUser');
        tgField.value = '';
        tgField.classList.remove('error-field');
        // сброс файла
        selectedFile = null;
        document.getElementById('screenshotFile').value = '';
        document.getElementById('fileName').innerHTML = '';
        document.getElementById('previewImg').style.display = 'none';
        document.getElementById('orderModal').classList.add('active');
        setTimeout(() => tgField.focus(), 100);
    }

    function closeModal() {
        document.getElementById('orderModal').classList.remove('active');
        currentOrder = null;
        selectedFile = null;
    }

    function copyPhone() {
        navigator.clipboard.writeText('+79027365759');
        showMsg('✅ Номер СБП скопирован: +7 902 736 57 59');
    }

    function showMsg(msg, isErr = false) {
        const t = document.getElementById('toastMsg');
        t.textContent = msg;
        t.classList.add('show');
        if(isErr) t.classList.add('error');
        else t.classList.remove('error');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    // Обработка выбора файла
    const fileUploadArea = document.getElementById('fileUploadArea');
    const fileInput = document.getElementById('screenshotFile');
    
    fileUploadArea.addEventListener('click', () => {
        fileInput.click();
    });
    
    fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
            selectedFile = e.target.files[0];
            document.getElementById('fileName').innerHTML = `<i class="fas fa-check-circle"></i> ${selectedFile.name}`;
            const reader = new FileReader();
            reader.onload = function(event) {
                const preview = document.getElementById('previewImg');
                preview.src = event.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(selectedFile);
        }
    });
    
    fileUploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        fileUploadArea.style.background = 'rgba(38,165,228,0.2)';
    });
    fileUploadArea.addEventListener('dragleave', () => {
        fileUploadArea.style.background = '';
    });
    fileUploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        fileUploadArea.style.background = '';
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
            selectedFile = e.dataTransfer.files[0];
            document.getElementById('fileName').innerHTML = `<i class="fas fa-check-circle"></i> ${selectedFile.name}`;
            const reader = new FileReader();
            reader.onload = function(event) {
                const preview = document.getElementById('previewImg');
                preview.src = event.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(selectedFile);
        }
    });

    // Отправка чека на сервер (без перехода в Telegram)
    async function sendCheckToServer() {
        if (!currentOrder) {
            showMsg('Ошибка: заказ не найден', true);
            return;
        }

        const raw = getRawTelegram();
        if (!raw) {
            showMsg('❌ Укажите Telegram username (латиница, цифры, _, 5–7 символов)', true);
            document.getElementById('tgUser').focus();
            return;
        }

        if (!selectedFile) {
            showMsg('❌ Прикрепите скриншот чека', true);
            return;
        }

        showMsg('🔄 Отправка чека...', false);

        const formData = new FormData();
        formData.append('user_id', raw);
        formData.append('product_name', currentOrder.name);
        formData.append('product_price', currentOrder.price);
        formData.append('screenshot', selectedFile);

        try {
            const response = await fetch('/upload_check', {   // запрос на свой сервер
                method: 'POST',
                body: formData
            });
            const result = await response.json();
            if (result.status === 'ok') {
                showMsg('✅ Чек отправлен! Админ проверит оплату.', false);
                closeModal();
            } else {
                showMsg('❌ Ошибка: ' + (result.error || 'неизвестная'), true);
            }
        } catch (error) {
            console.error('Ошибка отправки:', error);
            showMsg('❌ Ошибка соединения с сервером', true);
        }
    }

    const tgInput = document.getElementById('tgUser');
    tgInput.addEventListener('input', updateInputValidation);
    tgInput.addEventListener('blur', updateInputValidation);
    
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            const tabName = tab.dataset.tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`${tabName}-tab`).classList.add('active');
        });
    });
    
    document.getElementById('sendCheckBtn').addEventListener('click', sendCheckToServer);
    renderProducts();
</script>
</body>
  </html>
